<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}</style>
</head><body>
<script>

const CY = "#3BE3D4", OR = "#FF8A2B", RD = "#FF4B3E", INK = "#F0EFEA";

function buildings(detail){
  const b = [
    [10,352,64,160],[70,326,58,186],[126,364,52,148],[176,300,72,212],
    [244,336,44,176],[286,348,70,164],[352,292,62,220],[412,340,52,172],
    [462,366,50,146]
  ];
  let s = "";
  for(const [x,y,w,h] of b){
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#06080D"/>`;
    s += `<rect x="${x}" y="${y}" width="${w}" height="2" fill="#FFC27A" opacity=".22"/>`;
    if(detail && x % 3 === 0) s += `<rect x="${x + w/2 - 1}" y="${y - 14}" width="2" height="14" fill="#05070A"/>`;
  }
  if(detail){
    const wins=[[38,336],[38,362],[96,372],[136,314],[136,340],[196,348],[232,290],[232,314],[268,290],[300,324],[336,304],[336,330],[386,344],[424,318],[424,344],[478,358]];
    for(const [x,y] of wins) s += `<rect x="${x}" y="${y}" width="5" height="7" fill="#F2B463" opacity=".7"/>`;
  }
  return s;
}

function trails(detail){
  if(!detail){
    return `<rect x="0" y="474" width="512" height="10" fill="${OR}" opacity=".92"/>
            <rect x="0" y="492" width="512" height="5" fill="${RD}" opacity=".62"/>`;
  }
  return `
    <rect x="0" y="452" width="512" height="60" fill="#05070A"/>
    <path d="M-10 480 C 150 466, 330 494, 522 470" fill="none" stroke="${RD}" stroke-width="3" opacity=".45"/>
    <path d="M-10 480 C 150 466, 330 494, 522 470" fill="none" stroke="#FFB4AC" stroke-width="1.2" opacity=".5"/>
    <path d="M-10 496 C 160 484, 340 508, 522 488" fill="none" stroke="${OR}" stroke-width="4.5" opacity=".9"/>
    <path d="M-10 496 C 160 484, 340 508, 522 488" fill="none" stroke="#FFD9A8" stroke-width="1.6" opacity=".85"/>
    <path d="M-10 462 C 170 452, 350 472, 522 452" fill="none" stroke="${RD}" stroke-width="2" opacity=".3"/>
  `;
}

function clouds(detail){
  if(!detail) return "";
  return `
    <path d="M42 148 C 128 130, 208 158, 300 138" fill="none" stroke="${INK}" stroke-width="1.8" opacity=".14"/>
    <path d="M318 116 C 392 102, 448 124, 506 108" fill="none" stroke="${INK}" stroke-width="1.8" opacity=".11"/>
    <path d="M96 196 C 186 178, 252 202, 344 184" fill="none" stroke="${CY}" stroke-width="1.4" opacity=".14"/>
    <path d="M360 214 C 420 202, 464 220, 512 206" fill="none" stroke="${INK}" stroke-width="1.4" opacity=".08"/>
  `;
}

function emblem(cx, cy, s, detail){
  const W = 158*s, H = 120*s, r = 14*s;
  const x = cx - W/2, y = cy - H/2;
  const lensR = 40*s, faceR = 33*s;
  const body = `
    <rect x="${x}" y="${y}" width="${W}" height="${H}" rx="${r}" ry="${r}" fill="#07090C" stroke="${CY}" stroke-width="${6*s}"/>
    <rect x="${x + 40*s}" y="${y - 11*s}" width="40*s" height="13*s" fill="#07090C" stroke="${CY}" stroke-width="${4.5*s}"/>
  `;
  const lens = `
    <circle cx="${cx}" cy="${cy}" r="${lensR}" fill="#0B0F14" stroke="${CY}" stroke-width="${5*s}"/>
    <circle cx="${cx}" cy="${cy}" r="${faceR}" fill="none" stroke="${INK}" stroke-width="${2*s}" opacity=".8"/>
  `;
  let ticks = "";
  const n = detail ? 12 : 4;
  for(let i=0;i<n;i++){
    const a = i * (Math.PI*2/n);
    const r1 = faceR * (detail ? .84 : .6), r2 = faceR * .98;
    ticks += `<line x1="${cx + Math.sin(a)*r1}" y1="${cy - Math.cos(a)*r1}"
                    x2="${cx + Math.sin(a)*r2}" y2="${cy - Math.cos(a)*r2}"
                    stroke="${INK}" stroke-width="${(i%3===0?2.2:1.3)*s}" opacity="${i%3===0?.9:.45}"/>`;
  }
  const hands = `
    <line x1="${cx}" y1="${cy}" x2="${cx + 1*s}" y2="${cy - 21*s}" stroke="${INK}" stroke-width="${2.8*s}"/>
    <line x1="${cx}" y1="${cy}" x2="${cx + 16*s}" y2="${cy + 9*s}" stroke="${OR}" stroke-width="${2.8*s}"/>
    <circle cx="${cx}" cy="${cy}" r="${3*s}" fill="${INK}"/>
  `;
  const speed = detail ? `
    <line x1="${x - 30*s}" y1="${cy - 22*s}" x2="${x - 6*s}" y2="${cy - 22*s}" stroke="${CY}" stroke-width="${3.6*s}" opacity=".9"/>
    <line x1="${x - 44*s}" y1="${cy}" x2="${x - 6*s}" y2="${cy}" stroke="${CY}" stroke-width="${3.6*s}" opacity=".6"/>
    <line x1="${x - 22*s}" y1="${cy + 22*s}" x2="${x - 6*s}" y2="${cy + 22*s}" stroke="${CY}" stroke-width="${3.6*s}" opacity=".32"/>
    <path d="M${x + W + 12*s} ${cy - 15*s} L${x + W + 30*s} ${cy} L${x + W + 12*s} ${cy + 15*s}" fill="none" stroke="${OR}" stroke-width="${4.4*s}"/>
    <path d="M${x + W + 30*s} ${cy - 15*s} L${x + W + 48*s} ${cy} L${x + W + 30*s} ${cy + 15*s}" fill="none" stroke="${OR}" stroke-width="${4.4*s}" opacity=".55"/>
  ` : `
    <line x1="${x - 18*s}" y1="${cy}" x2="${x - 4*s}" y2="${cy}" stroke="${CY}" stroke-width="${6*s}"/>
    <path d="M${x + W + 8*s} ${cy - 13*s} L${x + W + 24*s} ${cy} L${x + W + 8*s} ${cy + 13*s}" fill="none" stroke="${OR}" stroke-width="${6*s}"/>
  `;
  const ghost = detail ? `
    <g opacity=".15" transform="translate(${-7*s},${6*s})">
      <rect x="${x}" y="${y}" width="${W}" height="${H}" rx="${r}" ry="${r}" fill="none" stroke="${CY}" stroke-width="${4*s}"/>
      <circle cx="${cx}" cy="${cy}" r="${lensR}" fill="none" stroke="${CY}" stroke-width="${3.4*s}"/>
    </g>` : "";
  return ghost + body + lens + ticks + hands + speed;
}

function svg512(){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#04070D"/>
        <stop offset=".30" stop-color="#0A1B2C"/>
        <stop offset=".50" stop-color="#173B54"/>
        <stop offset=".60" stop-color="#54565C"/>
        <stop offset=".68" stop-color="#8B5433"/>
        <stop offset=".76" stop-color="#D07C31"/>
        <stop offset=".84" stop-color="#FFAE5C"/>
        <stop offset="1" stop-color="#FFC98A"/>
      </linearGradient>
      <radialGradient id="glow" cx=".5" cy="1" r=".8">
        <stop offset="0" stop-color="#FFB566" stop-opacity=".55"/>
        <stop offset="1" stop-color="#FFB566" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="daynight" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#04101F" stop-opacity=".34"/>
        <stop offset=".55" stop-color="#04101F" stop-opacity="0"/>
        <stop offset="1" stop-color="#FF9A3C" stop-opacity=".12"/>
      </linearGradient>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="7"/>
      </filter>
    </defs>
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#daynight)"/>
    ${clouds(true)}
    <rect x="0" y="286" width="512" height="146" fill="url(#glow)"/>
    <g filter="url(#soft)" opacity=".5">
      <circle cx="256" cy="296" r="96" fill="${CY}" opacity=".28"/>
    </g>
    ${buildings(true)}
    <rect x="0" y="430" width="512" height="82" fill="#04060A"/>
    ${trails(true)}
    ${emblem(256, 296, 1.0, true)}
  </svg>`;
}

function svgSmall(size){
  const s = size / 512;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="${size}" height="${size}">
    <defs>
      <linearGradient id="skyS${size}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#07131F"/>
        <stop offset=".46" stop-color="#16405A"/>
        <stop offset=".74" stop-color="#A85C2E"/>
        <stop offset="1" stop-color="#F5B266"/>
      </linearGradient>
    </defs>
    <rect width="512" height="512" fill="url(#skyS${size})"/>
    <g opacity=".95">
      <rect x="0" y="430" width="512" height="82" fill="#04060A"/>
      <rect x="34" y="330" width="120" height="182" fill="#05070A"/>
      <rect x="356" y="312" width="126" height="200" fill="#05070A"/>
    </g>
    ${trails(false)}
    ${emblem(256, 258, 1.42, false)}
  </svg>`;
}


(function(){
  const q = new URLSearchParams(location.search);
  const size = parseInt(q.get("s") || "512", 10);
  const full = q.get("v") !== "mini";
  const el = document.createElement("div");
  el.innerHTML = full ? svg512() : svgSmall(size);
  const svg = el.querySelector("svg");
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  document.body.appendChild(svg);
})();
</script>
</body></html>
